<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>race. — toutes vos courses, une ligne chacune</title>
    <meta
      name="description"
      content="race. répond à une seule question : qu'est-ce que j'ai couru ? Journal de courses local, hors ligne, sans compte."
    />
    <!-- Aperçu de lien. Les deux adresses ci-dessous sont les seules du dépôt
         à dépendre du domaine : à corriger le jour où le site en change. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="race." />
    <meta property="og:title" content="race. — toutes vos courses, une ligne chacune" />
    <meta
      property="og:description"
      content="Une seule question : qu'est-ce que j'ai couru ? Journal de courses local, hors ligne, sans compte."
    />
    <meta property="og:url" content="https://race-ochre.vercel.app/" />
    <meta property="og:image" content="https://race-ochre.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le mot « race. » en clair sur fond d'encre" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="theme-color" content="#f2f3f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Appliqué avant le premier rendu : évite le flash de thème clair.
      // Aucune requête, aucune dépendance — lecture locale seule.
      try {
        var raw = localStorage.getItem('race.v1')
        var theme = raw ? (JSON.parse(raw).settings || {}).theme : null
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme)
        }
      } catch (e) {
        /* stockage indisponible : le thème suit le système */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      race. a besoin de JavaScript pour fonctionner. Tout s'exécute sur votre
      appareil : rien n'est envoyé nulle part.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
